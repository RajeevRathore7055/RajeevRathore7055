
name: Generate GitHub Stats Card

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent simultaneous workflows from pushing to main
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate stats + top languages card
        uses: lowlighter/metrics@latest
        with:
          filename: assets/stats-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: RajeevRathore7055
          template: classic
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          config_timezone: Asia/Kolkata
          config_output: svg

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stats-card.svg

          if git diff --cached --quiet; then
            echo "No stats card changes. Skipping commit and push."
            exit 0
          fi

          git commit -m "chore: update stats card"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
